# version: '3.8'
services:
  docker-app:
    image: docker-app:dev
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: docker-app-dev
    ports:
      - "3005:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - build:/app/.next
    networks:
      - docker-app-network
    restart: unless-stopped
    # env_file:
    #   - .env

volumes:
  node_modules:
  build:
  # redis-data:
networks:
  docker-app-network:
    driver: bridge
